services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DOMAIN: ${DOMAIN:-http://localhost:8080}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: "true"
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_FROM: vaultwarden@example.com
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SECURITY: starttls
    volumes:
      - vaultwarden_data:/data
    networks:
      - security
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      GID: "1000"
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - security
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      AUTHELIA_DEFAULT_REDIRECTION_URL: http://localhost:9091
      AUTHELIA_SERVER_ADDRESS: tcp://0.0.0.0:9091
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET:-change_me_jwt_secret}
      AUTHELIA_TOTP_ISSUER: Authelia
    volumes:
      - authelia_data:/config
    networks:
      - security
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

networks:
  security:
    driver: bridge

volumes:
  vaultwarden_data:
  crowdsec_data:
  crowdsec_config:
  authelia_data:
